name: Lint blog content

on:
  pull_request:
    paths:
      - 'src/content/blog/**/*.mdx'
      - 'scripts/lint-blog-content.py'
      - '.github/workflows/lint-blog.yml'
  push:
    branches: [master, main]
    paths:
      - 'src/content/blog/**/*.mdx'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run blog linter
        run: python scripts/lint-blog-content.py
